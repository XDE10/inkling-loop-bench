[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopbench"
version = "0.1.0"
description = "Reproducible benchmark for latent looping and explicit reasoning in multimodal inference"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "numpy>=1.24", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
